services:
  - type: web
    name: valohub-api
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: RIOT_API_KEY
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
