<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VALOHUB — Stats Discord Miiana</title><style>:root{--bg:#09060d;--p:#17101d;--r:#ff365f;--v:#8b3dff;--t:#fff7fb;--m:#b9a7bd;--g:#62f2a1}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 70% 0,#3a103f,#100813 40%,#09060d);color:var(--t);font:15px/1.5 Arial,sans-serif}.wrap{max-width:1100px;margin:auto;padding:35px 20px}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:30px}.brand{font-weight:900;font-size:24px;letter-spacing:3px}.brand span{color:#ff6685}.btn{display:inline-block;text-decoration:none;color:#fff;padding:11px 16px;border-radius:8px;background:linear-gradient(135deg,var(--r),var(--v));font-weight:800}.panel{background:linear-gradient(145deg,#25142c,#140b18);border:1px solid #4b294a;border-radius:16px;padding:26px;box-shadow:0 20px 60px #0008}.eyebrow{color:#ff6685;font-size:10px;font-weight:900;letter-spacing:3px}.h1{font-size:clamp(36px,6vw,64px);line-height:.95;margin:10px 0}.muted{color:var(--m)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:24px}.stat{padding:22px;background:#211128;border:1px solid #3d2142;border-radius:12px}.stat strong{display:block;font-size:38px}.stat small{color:#a78fa9;letter-spacing:1px}.online{color:var(--g)}.status{margin-top:20px;padding:12px 14px;border-radius:9px;background:#1c1020}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}@media(max-width:650px){.top{align-items:flex-start;flex-direction:column}.stats{grid-template-columns:1fr}}</style></head><body><main class="wrap"><header class="top"><div class="brand"><span>VALO</span>HUB / MIANA</div><a class="btn" href="https://discord.gg/x7wvTMYHa" target="_blank" rel="noopener">Rejoindre Discord ↗</a></header><section class="panel"><div class="eyebrow">COMMUNAUTÉ</div><h1 class="h1" id="guildName">Serveur de Miiana</h1><p class="muted">Statistiques publiques récupérées depuis l'invitation Discord. Les compteurs sont approximatifs et sont actualisés automatiquement.</p><div class="stats"><div class="stat"><strong id="members">—</strong><small>MEMBRES</small></div><div class="stat"><strong class="online" id="online">—</strong><small>EN LIGNE</small></div><div class="stat"><strong id="activity">—</strong><small>ACTIVITÉ</small></div></div><div class="status" id="status">⏳ Chargement des statistiques…</div><div class="actions"><a class="btn" href="https://www.twitch.tv/miianatv" target="_blank" rel="noopener">🎥 MiianaTV</a><button class="btn" id="refresh" style="border:0;cursor:pointer">↻ Actualiser</button></div></section></main><script>const INVITE='x7wvTMYHa';const $=id=>document.getElementById(id);async function load(){ $('status').textContent='⏳ Actualisation…';try{const r=await fetch('https://discord.com/api/v10/invites/'+INVITE+'?with_counts=true',{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);const d=await r.json();const g=d.guild||{};const total=Number(d.approximate_member_count||0);const online=Number(d.approximate_presence_count||0);$('guildName').textContent=g.name||'Serveur de Miiana';$('members').textContent=total.toLocaleString('fr-FR');$('online').textContent=online.toLocaleString('fr-FR');$('activity').textContent=total?((online/total)*100).toFixed(1)+'%':'—';$('status').innerHTML='🟢 <b>Données disponibles</b> • dernière mise à jour : '+new Date().toLocaleTimeString('fr-FR');}catch(e){$('status').innerHTML='⚠️ Impossible de récupérer les statistiques directement depuis Discord. Vérifie que le lien d’invitation est toujours actif. <span style="opacity:.7">('+e.message+')</span>';}}$('refresh').addEventListener('click',load);load();setInterval(load,60000);</script></body></html>
