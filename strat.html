<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VALOHUB — Strat Planner</title><style>
:root{--r:#ff365f;--v:#8b3dff;--line:#4b294a;--text:#fff7fb;--muted:#b9a7bd}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 70% 0,#39103e,#09060d 60%);color:var(--text);font:14px Arial,sans-serif;overflow:hidden}.bar{height:64px;display:flex;align-items:center;gap:8px;padding:10px 16px;background:#0d0814ee;border-bottom:1px solid #34203b;position:relative;z-index:10}.title{font-weight:900;letter-spacing:2px;margin-right:auto}.btn,.tool,input{border:1px solid var(--line);background:#25132c;color:#fff;padding:9px 12px;border-radius:7px;cursor:pointer;font-weight:800}.btn.primary,.tool.active{background:linear-gradient(135deg,var(--r),var(--v));border-color:transparent}.layout{height:calc(100vh - 64px);display:grid;grid-template-columns:230px 1fr;min-height:0}.side{padding:14px;border-right:1px solid #34203b;background:#100913;overflow:auto}.side h3{font-size:10px;letter-spacing:2px;color:#a98eaa}.agents,.tools{display:grid;grid-template-columns:1fr 1fr;gap:8px}.agent{padding:10px;border:1px solid var(--line);background:#1b0f22;color:white;border-radius:8px;cursor:grab}.agent b{display:block}.agent small,.help{color:var(--muted)}.help{font-size:12px;line-height:1.5}.stage{position:relative;overflow:hidden;background:#08050b}.viewport{position:absolute;inset:0;overflow:hidden;cursor:grab}.viewport.dragging{cursor:grabbing}.board{position:absolute;left:0;top:0;width:1400px;height:800px;transform-origin:0 0;background:#16101b center/cover no-repeat;border:1px solid #633255;box-shadow:0 20px 80px #0009}.board:after{content:"";position:absolute;inset:0;background:linear-gradient(#0001,#0005)}.piece{position:absolute;z-index:5;width:54px;height:54px;border-radius:50%;display:grid;place-items:center;font-size:24px;font-weight:900;border:2px solid #fff;box-shadow:0 5px 20px #000c;cursor:grab;user-select:none}.piece.attack{background:linear-gradient(135deg,#ff365f,#a3133b)}.piece.defense{background:linear-gradient(135deg,#3d7cff,#573dff)}.smoke{width:65px;height:65px;border-radius:50%;background:#8d7d93aa;border:2px dashed #fff}.arrow{position:absolute;height:4px;background:var(--r);transform-origin:left center;z-index:4;pointer-events:none}.arrow:after{content:"";position:absolute;right:-1px;top:-5px;border-left:12px solid var(--r);border-top:7px solid transparent;border-bottom:7px solid transparent}.zoom{position:absolute;right:15px;bottom:15px;z-index:8;display:flex;gap:6px}.zoom button{width:42px;height:42px;border-radius:8px;border:1px solid var(--line);background:#1a0e21;color:#fff;font-size:20px;cursor:pointer}.legend{position:absolute;left:15px;bottom:15px;z-index:8;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:#100913dd;color:var(--muted)}.modal{position:fixed;inset:0;background:#000b;display:none;place-items:center;z-index:30}.modal.open{display:grid}.card{width:min(460px,92vw);background:#160d1d;border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:0 20px 80px #000}.card h2{margin-top:0}.card input{width:100%;margin:8px 0 14px;cursor:text}.row{display:flex;gap:8px;flex-wrap:wrap}.sharebox{margin-top:12px;padding:10px;border:1px solid var(--line);border-radius:8px;color:#ddd;word-break:break-all;font-size:12px;display:none}
@media(max-width:750px){.layout{grid-template-columns:1fr}.side{position:absolute;z-index:9;left:8px;top:72px;width:190px;max-height:70vh;border:1px solid var(--line);border-radius:10px}.bar{overflow:auto}.title{min-width:130px}.board{width:1000px;height:570px}}
</style></head><body><header class="bar"><a class="btn" href="./">← VALOHUB</a><div class="title" id="title">🗺️ STRAT PLANNER</div><button class="btn" id="clear">Effacer</button><button class="btn" id="openList">📚 Mes strats</button><button class="btn primary" id="save">💾 Enregistrer</button><button class="btn primary" id="share">🔗 Partager</button></header>
<div class="layout"><aside class="side"><h3>AGENTS — GLISSE SUR LA MAP</h3><div class="agents" id="agents"></div><h3>OUTILS</h3><div class="tools"><button class="tool active" data-tool="select">↖ Sélection</button><button class="tool" data-tool="arrow">➜ Flèche</button><button class="tool" data-tool="smoke">💨 Smoke</button><button class="tool" data-tool="erase">🗑 Effacer</button></div><h3>ÉQUIPE</h3><div class="tools"><button class="tool" id="sideAttack">🔴 Attaque</button><button class="tool" id="sideDefense">🔵 Défense</button></div><p class="help">Nomme ta strat puis enregistre-la. Le bouton Partager crée un lien contenant la stratégie : tu peux l'envoyer à tes amis.</p></aside><main class="stage"><div class="viewport" id="viewport"><div class="board" id="board" style="background-image:url('https://static1-us.millenium.gg/articles/1/19/00/1/%40/190354-ascent-la-4e-map-de-valorant-orig-1-full-1.png')"></div></div><div class="zoom"><button id="minus">−</button><button id="plus">+</button><button id="reset">⟳</button></div><div class="legend">🔴 Attaque · 🔵 Défense · 💨 Smoke</div></main></div>
<div class="modal" id="modal"><div class="card"><h2 id="modalTitle">💾 Enregistrer la stratégie</h2><label>Nom de la stratégie</label><input id="name" maxlength="60" placeholder="Ex : Ascent A Execute"><div class="row"><button class="btn primary" id="confirm">Enregistrer</button><button class="btn" id="close">Annuler</button></div><div class="sharebox" id="sharebox"></div></div></div>
<script>
const names=[['Jett','🌀'],['Omen','🌑'],['Killjoy','🤖'],['Sova','🏹'],['Raze','💥'],['Sage','❄️'],['Cypher','🕵️'],['Viper','🐍'],['Reyna','👁️'],['Breach','⚡']];const agents=document.getElementById('agents'),board=document.getElementById('board'),vp=document.getElementById('viewport'),modal=document.getElementById('modal'),nameInput=document.getElementById('name'),title=document.getElementById('title');let tool='select',team='attack',scale=1,ox=0,oy=0,dragging=null,pan=null,arrowStart=null,currentName='';
names.forEach(([n,e])=>{let b=document.createElement('button');b.className='agent';b.innerHTML=`<b>${e} ${n}</b><small>Glisser</small>`;b.draggable=true;b.ondragstart=ev=>ev.dataTransfer.setData('agent',JSON.stringify({n,e}));agents.appendChild(b)});function render(){board.style.transform=`translate(${ox}px,${oy}px) scale(${scale})`}function point(e){let r=vp.getBoundingClientRect();return{x:(e.clientX-r.left-ox)/scale,y:(e.clientY-r.top-oy)/scale}}
vp.ondragover=e=>e.preventDefault();vp.ondrop=e=>{e.preventDefault();let a;try{a=JSON.parse(e.dataTransfer.getData('agent'))}catch{return}let p=point(e);addPiece(a.n,a.e,p.x-27,p.y-27)};function addPiece(n,e,x,y){let p=document.createElement('div');p.className='piece '+team;p.textContent=e;p.title=n;p.style.left=x+'px';p.style.top=y+'px';p.dataset.name=n;p.onpointerdown=ev=>{if(tool==='erase'){p.remove();return}if(tool!=='select')return;ev.stopPropagation();dragging={el:p,dx:ev.clientX,dy:ev.clientY,x:p.offsetLeft,y:p.offsetTop};p.setPointerCapture(ev.pointerId)};p.onpointermove=ev=>{if(!dragging||dragging.el!==p)return;p.style.left=dragging.x+(ev.clientX-dragging.dx)/scale+'px';p.style.top=dragging.y+(ev.clientY-dragging.dy)/scale+'px'};p.onpointerup=()=>dragging=null;board.appendChild(p)}
document.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>{tool=b.dataset.tool;document.querySelectorAll('.tool').forEach(x=>x.classList.remove('active'));b.classList.add('active')});sideAttack.onclick=()=>team='attack';sideDefense.onclick=()=>team='defense';vp.onpointerdown=e=>{if(e.target!==vp)return;if(tool==='smoke'){let p=point(e),s=document.createElement('div');s.className='piece smoke';s.style.left=p.x-32+'px';s.style.top=p.y-32+'px';s.onclick=()=>s.remove();board.appendChild(s);return}if(tool==='arrow'){arrowStart=point(e);return}pan={x:e.clientX,y:e.clientY,ox,oy};vp.classList.add('dragging')};vp.onpointermove=e=>{if(pan){ox=pan.ox+e.clientX-pan.x;oy=pan.oy+e.clientY-pan.y;render()}};vp.onpointerup=e=>{if(arrowStart){let end=point(e),dx=end.x-arrowStart.x,dy=end.y-arrowStart.y,len=Math.hypot(dx,dy);if(len>10){let a=document.createElement('div');a.className='arrow';a.style.left=arrowStart.x+'px';a.style.top=arrowStart.y+'px';a.style.width=len+'px';a.style.transform=`rotate(${Math.atan2(dy,dx)}rad)`;a.onclick=()=>a.remove();board.appendChild(a)}arrowStart=null}pan=null;vp.classList.remove('dragging')};vp.onwheel=e=>{e.preventDefault();zoom(e.deltaY<0?1.1:.9,e.clientX,e.clientY)};function zoom(f,cx,cy){let r=vp.getBoundingClientRect(),mx=(cx-r.left-ox)/scale,my=(cy-r.top-oy)/scale,ns=Math.min(3,Math.max(.35,scale*f));ox=cx-r.left-mx*ns;oy=cy-r.top-my*ns;scale=ns;render()}plus.onclick=()=>zoom(1.2,vp.clientWidth/2,vp.clientHeight/2);minus.onclick=()=>zoom(.83,vp.clientWidth/2,vp.clientHeight/2);reset.onclick=()=>{scale=1;ox=0;oy=0;render()};clear.onclick=()=>board.querySelectorAll('.piece,.arrow').forEach(x=>x.remove());
function snapshot(){return{version:1,name:currentName,scale,ox,oy,items:[...board.children].filter(x=>x.classList.contains('piece')||x.classList.contains('arrow')).map(x=>({cls:x.className,style:x.getAttribute('style'),text:x.textContent,name:x.dataset.name}))}}function encode(d){return btoa(unescape(encodeURIComponent(JSON.stringify(d))))}function decode(s){return JSON.parse(decodeURIComponent(escape(atob(s))))}function apply(d){currentName=d.name||'Stratégie sans nom';title.textContent='🗺️ '+currentName;scale=d.scale||1;ox=d.ox||0;oy=d.oy||0;board.querySelectorAll('.piece,.arrow').forEach(x=>x.remove());(d.items||[]).forEach(x=>{let el=document.createElement('div');el.className=x.cls;el.setAttribute('style',x.style||'');el.textContent=x.text||'';if(x.name)el.dataset.name=x.name;el.onclick=()=>el.remove();board.appendChild(el)});render()}
function openSave(){nameInput.value=currentName||'';modal.classList.add('open');nameInput.focus()}save.onclick=openSave;close.onclick=()=>modal.classList.remove('open');confirm.onclick=()=>{currentName=nameInput.value.trim()||'Stratégie sans nom';localStorage.setItem('valohub-strat-'+currentName,JSON.stringify(snapshot()));localStorage.setItem('valohub-last-strat',currentName);title.textContent='🗺️ '+currentName;modal.classList.remove('open');alert('Stratégie enregistrée !')};openList.onclick=()=>{let keys=Object.keys(localStorage).filter(k=>k.startsWith('valohub-strat-'));if(!keys.length)return alert('Aucune stratégie enregistrée.');let msg='TES STRATÉGIES :\n\n'+keys.map((k,i)=>(i+1)+'. '+k.replace('valohub-strat-','')).join('\n');let pick=prompt(msg+'\n\nÉcris le nom exact à charger :');if(pick){let d=localStorage.getItem('valohub-strat-'+pick);if(d)apply(JSON.parse(d));else alert('Stratégie introuvable.')}};
share.onclick=async()=>{let d=snapshot(),url=location.origin+location.pathname+'?strat='+encode(d);try{await navigator.clipboard.writeText(url);alert('Lien de partage copié ! Envoie-le à tes amis 🔗')}catch{prompt('Copie ce lien :',url)}};
try{let q=new URLSearchParams(location.search).get('strat');if(q)apply(decode(q));else{let last=localStorage.getItem('valohub-last-strat');if(last){let d=localStorage.getItem('valohub-strat-'+last);if(d)apply(JSON.parse(d))}}}catch{}render();
</script></body></html>
